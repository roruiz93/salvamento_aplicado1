<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tierra 3D – Mapa Mundi Interactivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #info {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      color: #cce8ff; text-align: center; pointer-events: none; z-index: 10;
    }
    #info h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
    #info p  { font-size: 0.75rem; opacity: 0.6; margin-top: 4px; letter-spacing: 1px; }

    #controls-hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(200,220,255,0.5); font-size: 0.7rem; letter-spacing: 2px;
      pointer-events: none; z-index: 10;
    }

    #speed-control {
      position: absolute; top: 20px; right: 24px;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      z-index: 10;
    }
    #speed-control label { color: rgba(200,220,255,0.6); font-size: 0.7rem; letter-spacing: 2px; }
    #speed-control input[type=range] {
      -webkit-appearance: none; width: 120px; height: 3px;
      background: rgba(100,160,255,0.4); border-radius: 2px; outline: none;
    }
    #speed-control input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: #4af; border-radius: 50%; cursor: pointer;
    }

    .continent-label {
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-shadow:
        0 0 6px rgba(0,0,0,1),
        0 0 12px rgba(0,0,0,0.8),
        1px 1px 2px rgba(0,0,0,1);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

<div id="info">
  <h1>El Mundo</h1>
  <p>Inclinación axial real · 23.5°</p>
</div>
<div id="controls-hint">ARRASTRAR · RUEDA = ZOOM · DOBLE CLIC = RESET</div>
<div id="speed-control">
  <label>VELOCIDAD</label>
  <input type="range" id="speedSlider" min="0" max="10" value="2" step="0.1" />
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const BASE = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r158/examples/textures/planets/';

// ── RENDERER WebGL ────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ── RENDERER CSS2D (etiquetas HTML) ───────────────────────────
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.cssText =
  'position:absolute;top:0;left:0;pointer-events:none;';
document.body.appendChild(labelRenderer.domElement);

// ── ESCENA Y CÁMARA ───────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3.2);

// ── ORBIT CONTROLS ────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance   = 1.5;
controls.maxDistance   = 10;

renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(0, 0, 3.2);
  controls.target.set(0, 0, 0);
  controls.update();
});

// ── ESTRELLAS ─────────────────────────────────────────────────
(function buildStars() {
  const N = 8000, pos = new Float32Array(N*3), sz = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pos[i*3]   = (Math.random()-0.5)*300;
    pos[i*3+1] = (Math.random()-0.5)*300;
    pos[i*3+2] = (Math.random()-0.5)*300;
    sz[i] = Math.random()*1.5+0.3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));
  scene.add(new THREE.Points(geo, new THREE.ShaderMaterial({
    vertexShader: `attribute float size;
      void main(){
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=size*(300.0/-mv.z);
        gl_Position=projectionMatrix*mv;}`,
    fragmentShader: `void main(){
        float d=distance(gl_PointCoord,vec2(0.5));
        if(d>0.5)discard;
        gl_FragColor=vec4(1.0,1.0,1.0,1.0-smoothstep(0.3,0.5,d));}`,
    transparent: true, depthWrite: false,
  })));
})();

// ── GRUPO CON INCLINACIÓN AXIAL 23.5° ────────────────────────
const earthGroup = new THREE.Group();
earthGroup.rotation.z = 23.5 * Math.PI / 180;
scene.add(earthGroup);

// ── TEXTURAS ──────────────────────────────────────────────────
const loader   = new THREE.TextureLoader();
const earthTex = loader.load(BASE + 'earth_atmos_2048.jpg');
const bumpTex  = loader.load(BASE + 'earth_normal_2048.jpg');
const specTex  = loader.load(BASE + 'earth_specular_2048.jpg');

// ── GLOBO ─────────────────────────────────────────────────────
const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshPhongMaterial({
    map: earthTex, bumpMap: bumpTex, bumpScale: 0.05,
    specularMap: specTex, specular: new THREE.Color(0x224488), shininess: 15,
  })
);
earthGroup.add(earthMesh);

// ── ATMÓSFERA interna ─────────────────────────────────────────
earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.025, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x3366ff, transparent: true, opacity: 0.06, depthWrite: false })
));

// ── HALO exterior (fresnel) ───────────────────────────────────
earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.12, 64, 64),
  new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vN;
      void main(){
        vN=normalize(normalMatrix*normal);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `varying vec3 vN;
      void main(){
        float i=pow(0.68-dot(vN,vec3(0,0,1)),4.0);
        gl_FragColor=vec4(0.2,0.5,1.0,1.0)*i;}`,
    blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true, depthWrite: false,
  })
));

// ── EJE VISUAL ────────────────────────────────────────────────
earthGroup.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,-1.5,0), new THREE.Vector3(0,1.5,0)
  ]),
  new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.15, transparent: true })
));

// ── ILUMINACIÓN ───────────────────────────────────────────────
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(5, 2, 3);
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x8899cc, 0.6).position.set(-5,-1,-3) && new THREE.DirectionalLight(0x8899cc, 0.6));
const fill = new THREE.DirectionalLight(0x8899cc, 0.6);
fill.position.set(-5, -1, -3);
scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// ── NOMBRES DE CONTINENTES ────────────────────────────────────
// Convierte lat/lon a posición 3D en la superficie de la esfera.
// Fórmula estándar para equirectangular + Three.js SphereGeometry.
function latLonToVec3(lat, lon, r = 1.08) {
  const phi   = (90 - lat) * Math.PI / 180;   // polar (0 = norte)
  const theta = (lon + 180) * Math.PI / 180;  // azimutal
  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
  );
}

const CONTINENTS = [
  { name: 'NORTE AMÉRICA', lat:  48, lon: -100 },
  { name: 'SUR AMÉRICA',   lat: -14, lon:  -56 },
  { name: 'EUROPA',        lat:  52, lon:   18 },
  { name: 'ÁFRICA',        lat:   5, lon:   22 },
  { name: 'ASIA',          lat:  47, lon:   95 },
  { name: 'OCEANÍA',       lat: -27, lon:  134 },
  { name: 'ANTÁRTIDA',     lat: -80, lon:    0 },
];

const labelObjects = [];

CONTINENTS.forEach(({ name, lat, lon }) => {
  const div = document.createElement('div');
  div.className = 'continent-label';
  div.textContent = name;

  const label = new CSS2DObject(div);
  label.position.copy(latLonToVec3(lat, lon));
  earthMesh.add(label);        // se mueve con la rotación de la Tierra
  labelObjects.push(label);
});

// ── ANIMACIÓN ─────────────────────────────────────────────────
const speedSlider = document.getElementById('speedSlider');
function getSpeed() { return parseFloat(speedSlider.value) * 0.001; }

const _worldPos = new THREE.Vector3();

(function animate() {
  requestAnimationFrame(animate);

  earthMesh.rotation.y += getSpeed();
  controls.update();

  // Ocultar etiquetas que están en la cara posterior del globo
  labelObjects.forEach(obj => {
    obj.getWorldPosition(_worldPos);
    const dot = _worldPos.clone().normalize()
                          .dot(camera.position.clone().normalize());
    obj.element.style.opacity = dot > 0.1 ? '1' : '0';
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
