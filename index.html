<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tierra 3D – Corrientes Marinas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- HUD superior -->
  <div id="info">
    <h1>El Mundo</h1>
    <p>Corrientes marinas · inclinación axial real 23.5°</p>
  </div>
  <div id="controls-hint">ARRASTRAR · RUEDA = ZOOM · DOBLE CLIC = RESET</div>

  <!-- Control de velocidad -->
  <div id="speed-control">
    <label>VELOCIDAD</label>
    <input type="range" id="speedSlider" min="0" max="10" value="2" step="0.1" />
  </div>

  <!-- Leyenda -->
  <div id="legend">
    <div class="leg-title">Temperatura superficial</div>
    <div class="leg-bar"></div>
    <div class="leg-labels"><span>← Fría (0°C)</span><span>Cálida (30°C) →</span></div>
    <hr class="leg-sep">
    <div class="leg-row"><div class="leg-line" style="background:linear-gradient(to right,#ff1100,#ffaa00)"></div><span class="leg-txt">Corriente cálida</span></div>
    <div class="leg-row"><div class="leg-line" style="background:linear-gradient(to right,#0008aa,#00ccff)"></div><span class="leg-txt">Corriente fría</span></div>
    <div class="leg-row"><div class="leg-line" style="background:linear-gradient(to right,#ff4400,#00ddff,#ff4400)"></div><span class="leg-txt">Giro oceánico (circuito)</span></div>
  </div>

  <!-- Filtros -->
  <div id="filter-controls">
    <button class="fbtn act" id="btn-all">TODAS</button>
    <button class="fbtn"     id="btn-warm">CÁLIDAS</button>
    <button class="fbtn"     id="btn-cold">FRÍAS</button>
  </div>

  <!-- Botón navegación Mareas -->
  <button id="btn-mareas" onclick="location.href='mareas.html'">🌊 MAREAS</button>

  <!-- Panel lateral de corrientes -->
  <div id="cur-panel"></div>

  <!-- Card de detalle al hacer clic -->
  <div id="cur-card"></div>

  <!-- Three.js via importmap -->
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.158.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.158.0/examples/jsm/"}}
  </script>
  <script type="module" src="src/main.js"></script>

</body>
</html>
