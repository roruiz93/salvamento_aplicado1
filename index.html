import * as THREE from 'three';
import { OrbitControls }             from 'three/addons/controls/OrbitControls.js';

const BASE='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r158/examples/textures/planets/';

// ─ RENDERERS ────────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none;';
document.body.appendChild(labelRenderer.domElement);

// ─ ESCENA / CÁMARA / CONTROLS ───────────────────────────────
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(0,0,3.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=1.5;controls.maxDistance=10;
renderer.domElement.addEventListener('dblclick',()=>{camera.position.set(0,0,3.2);controls.target.set(0,0,0);controls.update();});

// ─ ESTRELLAS ───────────────────────────────────────────────
(()=>{const N=8000,p=new Float32Array(N*3),s=new Float32Array(N);
for(let i=0;i<N;i++){p[i*3]=(Math.random()-.5)*300;p[i*3+1]=(Math.random()-.5)*300;p[i*3+2]=(Math.random()-.5)*300;s[i]=Math.random()*1.5+.3;}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('size',new THREE.BufferAttribute(s,1));
scene.add(new THREE.Points(g,new THREE.ShaderMaterial({
vertexShader:`attribute float size;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(300./-mv.z);gl_Position=projectionMatrix*mv;}`,
fragmentShader:`void main(){float d=distance(gl_PointCoord,vec2(.5));if(d>.5)discard;gl_FragColor=vec4(1,1,1,1.-smoothstep(.3,.5,d));}`,
transparent:true,depthWrite:false})));})();

// ─ GLOBO TERRÁQUEO ────────────────────────────────────────────
const earthGroup=new THREE.Group();earthGroup.rotation.z=23.5*Math.PI/180;scene.add(earthGroup);

  map:ldr.load(BASE+'earth_atmos_2048.jpg'),bumpMap:ldr.load(BASE+'earth_normal_2048.jpg'),bumpScale:.05,
  specularMap:ldr.load(BASE+'earth_specular_2048.jpg'),specular:new THREE.Color(0x224488),shininess:15}));
earthGroup.add(earthMesh);
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.025,64,64),new THREE.MeshPhongMaterial({color:0x3366ff,transparent:true,opacity:.06,depthWrite:false})));
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,64,64),new THREE.ShaderMaterial({
  vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vN;void main(){float i=pow(.68-dot(vN,vec3(0,0,1)),4.);gl_FragColor=vec4(.2,.5,1,1)*i;}`,
  blending:THREE.AdditiveBlending,side:THREE.BackSide,transparent:true,depthWrite:false})));
earthGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1.5,0),new THREE.Vector3(0,1.5,0)]),new THREE.LineBasicMaterial({color:0xffffff,opacity:.15,transparent:true})));
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(5,2,3);scene.add(sun);

  {f:'c',cA:T.M1,cB:T.C4,n:30,s:.001,pts:[[-40,21],[-50,24],[-57,28]]},

  {f:'w',nm:'C. del Índico Sur',sv:15,tr:'9–20 °C',
   cA:T.M1,cB:T.M2,n:55,s:.001,pts:[[-40,21],[-40,40],[-40,60],[-40,82],[-40,100],[-36,108],[-35,115]]},

  {f:'w',nm:'C. Ecuatorial Norte Índico',sv:20,tr:'20–24 °C',
   cA:T.W1,cB:T.W1,n:40,s:.0011,pts:[[10,85],[5,82],[6,75],[6,65],[6,57],[8,48]]},

  {f:'w',nm:'C. de Somalia',sv:30,tr:'20–28 °C',
   cA:T.W1,cB:T.W1,n:35,s:.0012,pts:[[8,48],[4,46],[1,44],[-3,43],[-7,44],[-11,44]]},

  // ── CIRCUMPOLAR ────────────────────────────────────────────────
  {f:'c',nm:'Circumpolar Antártica',sv:130,tr:'0–2 °C',
   closed:true,n:130,s:.0007,cA:T.C4,cB:T.C4,
   pts:[[-57,-175],[-55,-148],[-57,-120],[-58,-90],[-56,-60],[-57,-30],[-55,-2],[-57,28],[-55,58],[-57,88],[-55,118],[-57,148],[-55,175]]},
];

// ─ CONSTRUIR LÍNEAS Y PARTÍCULAS ─────────────────────────────
const animCurrents=[];
const curObjects=[];
const R=1.027;

function buildCurrent(cur){
  const {pts,cA,cB,n=50,s=.0015,closed=false,f}=cur;
  const vecs=pts.map(([la,lo])=>ll(la,lo,R));
  const curve=new THREE.CatmullRomCurve3(vecs,closed,'catmullrom',.5);

  const NL=200,lineP=new Float32Array((NL+1)*3),lineC=new Float32Array((NL+1)*3);
  const ptsCurve=curve.getPoints(NL);
  for(let i=0;i<=NL;i++){
    const p=ptsCurve[Math.min(i,NL-1)],t=i/NL;
    lineP[i*3]=p.x;lineP[i*3+1]=p.y;lineP[i*3+2]=p.z;
    const[r,g,b]=lerpRGB(cA,cB,t);lineC[i*3]=r;lineC[i*3+1]=g;lineC[i*3+2]=b;
  }
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(lineP,3));
  lg.setAttribute('color',new THREE.BufferAttribute(lineC,3));
  const lineMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.38,depthWrite:false});
  const lineObj=closed?new THREE.LineLoop(lg,lineMat):new THREE.Line(lg,lineMat);
  earthMesh.add(lineObj);

  const pp=new Float32Array(n*3),pc=new Float32Array(n*3);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pp,3));
  geo.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pointsObj=new THREE.Points(geo,new THREE.PointsMaterial({vertexColors:true,size:.013,sizeAttenuation:true,transparent:true,opacity:.95,depthWrite:false}));
  earthMesh.add(pointsObj);

  curObjects.push({lineObj,pointsObj,f:f||null});
  animCurrents.push({curve,geo,offsets:Array.from({length:n},(_,i)=>i/n),s,n,closed,cA,cB});
}

CURRENTS.forEach(buildCurrent);

// ─ FILTRO ───────────────────────────────────────────────────
const btnAll=document.getElementById('btn-all');
const btnWarm=document.getElementById('btn-warm');
const btnCold=document.getElementById('btn-cold');
const curPanel=document.getElementById('cur-panel');

function setFilter(mode){
  btnAll.classList.toggle('act',mode==='all');
  btnWarm.classList.toggle('act',mode==='w');
  btnCold.classList.toggle('act',mode==='c');
  curObjects.forEach(({lineObj,pointsObj,f})=>{
    const show=mode==='all'||f===mode;
    lineObj.visible=show;
    pointsObj.visible=show;
  });
  if(mode==='all'){curPanel.style.display='none';return;}
  buildPanel(mode);
}

function buildPanel(mode){
  const isW=mode==='w';
  const named=CURRENTS.filter(c=>c.f===mode&&c.nm).sort((a,b)=>b.sv-a.sv);
  const maxSv=named[0]?.sv||1;
  const barCol=isW?'#ffb060':'#5aadff';
  let h=`<div class="cp-ttl ${mode}">${isW?'CORRIENTES CÁLIDAS':'CORRIENTES FRÍAS'}</div>`;
  named.forEach(c=>{
    const[r,g,b]=c.cA.map(v=>Math.round(v*255));
    const pct=Math.round(c.sv/maxSv*100);
    h+=`<div class="cp-row"><div class="cp-dot" style="background:rgb(${r},${g},${b})"></div><span class="cp-nm">${c.nm}</span><span class="cp-sv">${c.sv} Sv</span></div>`
      +`<div class="cp-bw"><div class="cp-bf" style="width:${pct}%;background:${barCol}"></div></div>`
      +`<div class="cp-tr">${c.tr}</div>`;
  });
  const total=named.reduce((s,c)=>s+c.sv,0);
  h+=`<div class="cp-foot">1 Sv = 1 000 000 m³/s<br>${named.length} corrientes · ${total} Sv aprox.</div>`;
  curPanel.innerHTML=h;
  curPanel.style.display='block';
}

btnAll.addEventListener('click',()=>setFilter('all'));
btnWarm.addEventListener('click',()=>setFilter('w'));
btnCold.addEventListener('click',()=>setFilter('c'));

// ─ ANIMACIÓN ────────────────────────────────────────────────
const speedSlider=document.getElementById('speedSlider');
const _wp=new THREE.Vector3();

(function animate(){
  requestAnimationFrame(animate);
  earthMesh.rotation.y+=parseFloat(speedSlider.value)*.001;
  controls.update();

  const camDir=camera.position.clone().normalize();
  labelObjects.forEach(o=>{o.getWorldPosition(_wp);o.element.style.opacity=_wp.clone().normalize().dot(camDir)>.1?'1':'0';});

  animCurrents.forEach(({curve,geo,offsets,s,n,closed,cA,cB})=>{
    const p=geo.attributes.position.array,c=geo.attributes.color.array;
    for(let i=0;i<n;i++){
      offsets[i]=(offsets[i]+s)%1;
      const t=closed?offsets[i]:Math.min(offsets[i],.9999);
      const v=curve.getPoint(t);p[i*3]=v.x;p[i*3+1]=v.y;p[i*3+2]=v.z;
      const[r,g,b]=lerpRGB(cA,cB,t);c[i*3]=r;c[i*3+1]=g;c[i*3+2]=b;
    }
    geo.attributes.position.needsUpdate=true;
    geo.attributes.color.needsUpdate=true;
  });

  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
})();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
