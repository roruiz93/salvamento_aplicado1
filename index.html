<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tierra 3D – Mapa Mundi Interactivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      color: #cce8ff; text-align: center; pointer-events: none; z-index: 10;
    }
    #info h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
    #info p  { font-size: 0.75rem; opacity: 0.6; margin-top: 4px; letter-spacing: 1px; }
    #controls-hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(200,220,255,0.5); font-size: 0.7rem; letter-spacing: 2px;
      pointer-events: none; z-index: 10;
    }
    #speed-control {
      position: absolute; top: 20px; right: 24px;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      z-index: 10;
    }
    #speed-control label { color: rgba(200,220,255,0.6); font-size: 0.7rem; letter-spacing: 2px; }
    #speed-control input[type=range] {
      -webkit-appearance: none; width: 120px; height: 3px;
      background: rgba(100,160,255,0.4); border-radius: 2px; outline: none;
    }
    #speed-control input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: #4af; border-radius: 50%; cursor: pointer;
    }
    /* Leyenda */
    #legend {
      position: absolute; bottom: 44px; right: 20px;
      background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none; z-index: 10;
    }
    .leg-row { display: flex; align-items: center; gap: 8px; }
    .leg-dot {
      width: 28px; height: 3px; border-radius: 2px;
    }
    .leg-txt { color: rgba(220,235,255,0.8); font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase; }
    .continent-label {
      color: #fff; font-size: 10px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
      text-shadow: 0 0 6px #000, 0 0 12px #000, 1px 1px 2px #000;
      pointer-events: none; white-space: nowrap; transition: opacity 0.3s;
    }
    .ocean-label {
      color: #7dd4fc; font-size: 9px; font-weight: 400; font-style: italic;
      letter-spacing: 3px; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,30,80,0.9), 0 0 4px rgba(0,0,0,0.8);
      pointer-events: none; white-space: nowrap; transition: opacity 0.3s;
    }
  </style>
</head>
<body>
<div id="info"><h1>El Mundo</h1><p>Inclinación axial real · 23.5°</p></div>
<div id="controls-hint">ARRASTRAR · RUEDA = ZOOM · DOBLE CLIC = RESET</div>
<div id="speed-control">
  <label>VELOCIDAD</label>
  <input type="range" id="speedSlider" min="0" max="10" value="2" step="0.1" />
</div>
<div id="legend">
  <div class="leg-row"><div class="leg-dot" style="background:#ff4433"></div><span class="leg-txt">Corriente cálida</span></div>
  <div class="leg-row"><div class="leg-dot" style="background:#33aaff"></div><span class="leg-txt">Corriente fría</span></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls }             from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const BASE = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r158/examples/textures/planets/';

// ── RENDERERS ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
document.body.appendChild(labelRenderer.domElement);

// ── ESCENA / CÁMARA / CONTROLS ────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1.5; controls.maxDistance = 10;
renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(0,0,3.2); controls.target.set(0,0,0); controls.update();
});

// ── ESTRELLAS ─────────────────────────────────────────────────
(()=>{
  const N=8000,pos=new Float32Array(N*3),sz=new Float32Array(N);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*300;pos[i*3+1]=(Math.random()-.5)*300;pos[i*3+2]=(Math.random()-.5)*300;sz[i]=Math.random()*1.5+.3;}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('size',new THREE.BufferAttribute(sz,1));
  scene.add(new THREE.Points(g,new THREE.ShaderMaterial({
    vertexShader:`attribute float size;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*(300.0/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`void main(){float d=distance(gl_PointCoord,vec2(.5));if(d>.5)discard;gl_FragColor=vec4(1,1,1,1.-smoothstep(.3,.5,d));}`,
    transparent:true,depthWrite:false})));
})();

// ── TIERRA ────────────────────────────────────────────────────
const earthGroup = new THREE.Group();
earthGroup.rotation.z = 23.5*Math.PI/180;
scene.add(earthGroup);

const loader = new THREE.TextureLoader();
const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1,64,64),
  new THREE.MeshPhongMaterial({
    map:      loader.load(BASE+'earth_atmos_2048.jpg'),
    bumpMap:  loader.load(BASE+'earth_normal_2048.jpg'), bumpScale:0.05,
    specularMap: loader.load(BASE+'earth_specular_2048.jpg'),
    specular: new THREE.Color(0x224488), shininess:15,
  })
);
earthGroup.add(earthMesh);
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.025,64,64),
  new THREE.MeshPhongMaterial({color:0x3366ff,transparent:true,opacity:.06,depthWrite:false})));
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,64,64),
  new THREE.ShaderMaterial({
    vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vN;void main(){float i=pow(.68-dot(vN,vec3(0,0,1)),4.);gl_FragColor=vec4(.2,.5,1,1)*i;}`,
    blending:THREE.AdditiveBlending,side:THREE.BackSide,transparent:true,depthWrite:false})));
earthGroup.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1.5,0),new THREE.Vector3(0,1.5,0)]),
  new THREE.LineBasicMaterial({color:0xffffff,opacity:.15,transparent:true})));

const sun=new THREE.DirectionalLight(0xffffff,2.5); sun.position.set(5,2,3); scene.add(sun);
const fill=new THREE.DirectionalLight(0x8899cc,.6); fill.position.set(-5,-1,-3); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,.5));

// ── HELPER lat/lon → Vector3 ───────────────────────────────────
function ll(lat,lon,r=1.08){
  const phi=(90-lat)*Math.PI/180, theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(-(r*Math.sin(phi)*Math.cos(theta)),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
}

// ── ETIQUETAS CONTINENTES / OCÉANOS ───────────────────────────
const labelObjects=[];
function addLabel(text,lat,lon,cls){
  const d=document.createElement('div'); d.className=cls; d.textContent=text;
  const o=new CSS2DObject(d); o.position.copy(ll(lat,lon)); earthMesh.add(o); labelObjects.push(o);
}
addLabel('NORTE AMÉRICA',48,-100,'continent-label');
addLabel('SUR AMÉRICA',-14,-56,'continent-label');
addLabel('EUROPA',52,18,'continent-label');
addLabel('ÁFRICA',5,22,'continent-label');
addLabel('ASIA',47,95,'continent-label');
addLabel('OCEANÍA',-27,134,'continent-label');
addLabel('ANTÁRTIDA',-80,0,'continent-label');
addLabel('OCÉANO PACÍFICO NORTE',25,-155,'ocean-label');
addLabel('OCÉANO PACÍFICO SUR',-35,-140,'ocean-label');
addLabel('OCÉANO ATLÁNTICO NORTE',38,-38,'ocean-label');
addLabel('OCÉANO ATLÁNTICO SUR',-30,-18,'ocean-label');
addLabel('OCÉANO ÍNDICO',-22,75,'ocean-label');
addLabel('OCÉANO ÁRTICO',85,0,'ocean-label');
addLabel('OCÉANO AUSTRAL',-60,90,'ocean-label');

// ── CORRIENTES MARINAS ──────────────────────────────────────
const WARM=0xff4433, COLD=0x33aaff;
const CR=1.028; // radio ligeramente sobre la superficie

const CURRENTS=[
  // ===== CÁLIDAS =====
  // Gulf Stream + Atlántico Norte + Noruega
  {c:WARM,s:.0018,pts:[[25,-80],[30,-79],[35,-74],[38,-68],[42,-58],[46,-45],[50,-32],[53,-20],[57,-8],[60,2],[65,6],[70,10]]},
  // Corriente Ecuatorial Norte (Atlántico, W)
  {c:WARM,s:.0013,pts:[[15,-18],[15,-30],[15,-45],[15,-60],[15,-75],[18,-82]]},
  // Contracorriente Ecuatorial (Atlántico, E)
  {c:WARM,s:.0011,pts:[[5,-50],[5,-38],[5,-25],[5,-12],[5,0],[5,8]]},
  // Ecuatorial Sur (Atlántico, W)
  {c:WARM,s:.0012,pts:[[-3,5],[-3,-8],[-4,-22],[-5,-38],[-6,-52]]},
  // Corriente de Brasil
  {c:WARM,s:.0015,pts:[[-5,-35],[-12,-38],[-20,-41],[-28,-46],[-36,-52],[-42,-55]]},
  // Corriente de Guinea
  {c:WARM,s:.001,pts:[[3,8],[2,5],[1,2],[0,-2],[-1,-5]]},
  // Kuroshio
  {c:WARM,s:.0018,pts:[[15,135],[20,130],[26,128],[32,131],[37,140],[40,147],[43,153],[44,158]]},
  // Corriente del Pacífico Norte (extensión Kuroshio)
  {c:WARM,s:.0013,pts:[[43,155],[43,168],[43,-175],[43,-160],[43,-145],[43,-133]]},
  // Corriente de Alaska
  {c:WARM,s:.0012,pts:[[43,-133],[47,-137],[52,-143],[55,-150],[55,-158],[54,-166]]},
  // Ecuatorial Norte (Pacífico, W)
  {c:WARM,s:.0012,pts:[[14,-108],[14,-130],[14,-155],[14,-175],[14,170],[14,155],[14,140],[14,130]]},
  // Contracorriente Ecuatorial (Pacífico, E)
  {c:WARM,s:.001,pts:[[7,132],[7,148],[7,165],[7,-175],[7,-155],[7,-132],[7,-110],[7,-95]]},
  // Ecuatorial Sur (Pacífico, W)
  {c:WARM,s:.0012,pts:[[-5,-85],[-5,-108],[-5,-138],[-5,-165],[-5,175],[-5,155],[-5,140]]},
  // Corriente de Australia Oriental
  {c:WARM,s:.0015,pts:[[-15,155],[-20,154],[-26,153],[-32,152],[-38,151],[-42,149]]},
  // Corriente de las Agujas (Agulhas)
  {c:WARM,s:.0015,pts:[[-20,37],[-26,34],[-31,29],[-35,26],[-38,23],[-40,20]]},
  // Canal de Mozambique
  {c:WARM,s:.0012,pts:[[-12,43],[-18,40],[-24,37],[-28,34],[-31,32]]},
  // Ecuatorial del Índico (W)
  {c:WARM,s:.0011,pts:[[8,78],[8,67],[8,57],[8,48],[8,42]]},

  // ===== FRÍAS =====
  // Corriente del Labrador
  {c:COLD,s:.0016,pts:[[78,-65],[70,-58],[62,-55],[55,-52],[48,-52],[43,-50]]},
  // Corriente de Groenlandia Oriental
  {c:COLD,s:.0013,pts:[[82,-12],[75,-20],[68,-22],[62,-28],[58,-36],[54,-42]]},
  // Corriente de Canarias
  {c:COLD,s:.0013,pts:[[52,-10],[45,-12],[38,-12],[30,-14],[22,-17],[14,-17]]},
  // Corriente de California
  {c:COLD,s:.0015,pts:[[55,-130],[50,-128],[44,-126],[38,-123],[32,-120],[25,-115],[20,-108]]},
  // Oyashio / Kamchatka
  {c:COLD,s:.0015,pts:[[58,163],[53,158],[48,153],[43,148],[37,143]]},
  // Corriente del Perú (Humboldt)
  {c:COLD,s:.0015,pts:[[-42,-73],[-34,-73],[-26,-72],[-18,-73],[-10,-76],[-3,-81],[4,-80]]},
  // Benguela
  {c:COLD,s:.0013,pts:[[-38,18],[-30,14],[-22,12],[-14,12],[-6,11]]},
  // Malvinas (Falkland)
  {c:COLD,s:.0014,pts:[[-56,-65],[-50,-60],[-44,-56],[-38,-53],[-33,-51]]},
  // Australia Occidental
  {c:COLD,s:.0012,pts:[[-32,112],[-26,111],[-20,112],[-14,114],[-8,115]]},
  // Corriente Circumpolar Antártica (bucle cerrado, fluye hacia el E)
  {c:COLD,s:.0007,closed:true,n:120,pts:[
    [-57,-178],[-55,-150],[-57,-120],[-58,-90],[-56,-60],[-57,-30],
    [-55,0],[-57,30],[-55,60],[-57,90],[-55,120],[-57,150],[-55,178]
  ]},
];

// Construye cada corriente: línea estática + partículas animadas
const animatedCurrents = [];

CURRENTS.forEach(({c,s,pts,closed=false,n=55})=>{
  const vecs = pts.map(([lat,lon])=>ll(lat,lon,CR));
  const curve = new THREE.CatmullRomCurve3(vecs, closed, 'catmullrom', 0.5);

  // Línea de trayecto sutil
  const lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(120));
  const lineMat = new THREE.LineBasicMaterial({
    color:c, transparent:true, opacity:0.22, depthWrite:false
  });
  earthMesh.add(closed
    ? new THREE.LineLoop(lineGeo, lineMat)
    : new THREE.Line(lineGeo, lineMat));

  // Partículas
  const pos = new Float32Array(n*3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    color:c, size:0.013, sizeAttenuation:true, transparent:true, opacity:.9, depthWrite:false
  });
  earthMesh.add(new THREE.Points(geo, mat));

  // Offset inicial distribuido uniformemente
  const offsets = Array.from({length:n},(_,i)=>i/n);
  animatedCurrents.push({curve, geo, offsets, speed:s, count:n, closed});
});

// ── ANIMACIÓN ─────────────────────────────────────────────────
const speedSlider = document.getElementById('speedSlider');
const _wp = new THREE.Vector3();

(function animate(){
  requestAnimationFrame(animate);
  const gs = parseFloat(speedSlider.value)*0.001;
  earthMesh.rotation.y += gs;
  controls.update();

  // Ocultar etiquetas en cara posterior
  const camDir = camera.position.clone().normalize();
  labelObjects.forEach(o=>{
    o.getWorldPosition(_wp);
    o.element.style.opacity = _wp.clone().normalize().dot(camDir)>.1?'1':'0';
  });

  // Avanzar partículas de corrientes
  animatedCurrents.forEach(({curve,geo,offsets,speed,count,closed})=>{
    const arr = geo.attributes.position.array;
    for(let i=0;i<count;i++){
      offsets[i]=(offsets[i]+speed)%1;
      // Para curvas no cerradas limitar a [0,0.9999]
      const t = closed ? offsets[i] : Math.min(offsets[i],0.9999);
      const p = curve.getPoint(t);
      arr[i*3]=p.x; arr[i*3+1]=p.y; arr[i*3+2]=p.z;
    }
    geo.attributes.position.needsUpdate=true;
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
