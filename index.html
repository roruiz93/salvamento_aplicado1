<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tierra 3D – Mapa Mundi Interactivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #cce8ff;
      text-align: center;
      pointer-events: none;
    }
    #info h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
    #info p  { font-size: 0.75rem; opacity: 0.6; margin-top: 4px; letter-spacing: 1px; }

    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(200,220,255,0.5);
      font-size: 0.7rem;
      letter-spacing: 2px;
      pointer-events: none;
    }

    #speed-control {
      position: absolute;
      top: 20px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    #speed-control label {
      color: rgba(200,220,255,0.6);
      font-size: 0.7rem;
      letter-spacing: 2px;
    }
    #speed-control input[type=range] {
      -webkit-appearance: none;
      width: 120px;
      height: 3px;
      background: rgba(100,160,255,0.4);
      border-radius: 2px;
      outline: none;
    }
    #speed-control input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #4af;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="info">
  <h1>El Mundo</h1>
  <p>Inclinación axial real · 23.5°</p>
</div>

<div id="controls-hint">ARRASTRAR · RUEDA = ZOOM · DOBLE CLIC = RESET</div>

<div id="speed-control">
  <label>VELOCIDAD</label>
  <input type="range" id="speedSlider" min="0" max="10" value="2" step="0.1" />
</div>

<!-- Three.js r158 desde CDN -->
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3.2);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 10;
controls.autoRotate = false;

renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(0, 0, 3.2);
  controls.target.set(0, 0, 0);
  controls.update();
});

(function buildStars() {
  const geo = new THREE.BufferGeometry();
  const N = 8000;
  const pos = new Float32Array(N * 3);
  const sizes = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = 300;
    pos[i * 3]     = (Math.random() - 0.5) * r;
    pos[i * 3 + 1] = (Math.random() - 0.5) * r;
    pos[i * 3 + 2] = (Math.random() - 0.5) * r;
    sizes[i] = Math.random() * 1.5 + 0.3;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      attribute float size;
      void main() {
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mvPos.z);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      void main() {
        float d = distance(gl_PointCoord, vec2(0.5));
        if (d > 0.5) discard;
        float alpha = 1.0 - smoothstep(0.3, 0.5, d);
        gl_FragColor = vec4(1.0, 1.0, 1.0, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
  });
  scene.add(new THREE.Points(geo, mat));
})();

const earthGroup = new THREE.Group();
earthGroup.rotation.z = 23.5 * (Math.PI / 180);
scene.add(earthGroup);

const loader = new THREE.TextureLoader();
const earthTex   = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
const bumpTex    = loader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
const specTex    = loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
const cloudsTex  = loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');

const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshPhongMaterial({
    map:         earthTex,
    bumpMap:     bumpTex,
    bumpScale:   0.06,
    specularMap: specTex,
    specular:    new THREE.Color(0x2244aa),
    shininess:   25,
  })
);
earthGroup.add(earthMesh);

const cloudsMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1.012, 64, 64),
  new THREE.MeshPhongMaterial({
    map:         cloudsTex,
    transparent: true,
    opacity:     0.55,
    depthWrite:  false,
  })
);
earthGroup.add(cloudsMesh);

earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.025, 64, 64),
  new THREE.MeshPhongMaterial({
    color:       0x3366ff,
    transparent: true,
    opacity:     0.07,
    side:        THREE.FrontSide,
    depthWrite:  false,
  })
));

earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.12, 64, 64),
  new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      void main() {
        float i = pow(0.68 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
        gl_FragColor = vec4(0.2, 0.5, 1.0, 1.0) * i;
      }
    `,
    blending:    THREE.AdditiveBlending,
    side:        THREE.BackSide,
    transparent: true,
    depthWrite:  false,
  })
));

earthGroup.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -1.5, 0),
    new THREE.Vector3(0,  1.5, 0),
  ]),
  new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.15, transparent: true })
));

const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.0);
sunLight.position.set(5, 2, 3);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x0a1530, 1.2));

const speedSlider = document.getElementById('speedSlider');
function getSpeed() { return parseFloat(speedSlider.value) * 0.001; }

function animate() {
  requestAnimationFrame(animate);
  const speed = getSpeed();
  earthMesh.rotation.y  += speed;
  cloudsMesh.rotation.y += speed * 1.1;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
