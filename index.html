<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tierra 3D – Corrientes Marinas</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;}
    canvas{display:block;}
    #info{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#cce8ff;text-align:center;pointer-events:none;z-index:10;}
    #info h1{font-size:1.4rem;font-weight:300;letter-spacing:4px;text-transform:uppercase;}
    #info p{font-size:.75rem;opacity:.6;margin-top:4px;letter-spacing:1px;}
    #controls-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(200,220,255,.5);font-size:.7rem;letter-spacing:2px;pointer-events:none;z-index:10;}
    #speed-control{position:absolute;top:20px;right:24px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:10;}
    #speed-control label{color:rgba(200,220,255,.6);font-size:.7rem;letter-spacing:2px;}
    #speed-control input[type=range]{-webkit-appearance:none;width:120px;height:3px;background:rgba(100,160,255,.4);border-radius:2px;outline:none;}
    #speed-control input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:#4af;border-radius:50%;cursor:pointer;}
    #legend{position:absolute;bottom:44px;right:20px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:10;min-width:200px;}
    .leg-title{color:rgba(220,235,255,.9);font-size:.62rem;letter-spacing:2px;text-transform:uppercase;text-align:center;}
    .leg-bar{width:100%;height:9px;border-radius:5px;background:linear-gradient(to right,#000e6e,#0044ff,#00ddff,#44ff88,#ccff00,#ffcc00,#ff6600,#ff1100);}
    .leg-labels{display:flex;justify-content:space-between;color:rgba(200,220,255,.55);font-size:.58rem;letter-spacing:1px;}
    .leg-sep{border:none;border-top:1px solid rgba(255,255,255,.1);}
    .leg-row{display:flex;align-items:center;gap:8px;}
    .leg-line{width:28px;height:3px;border-radius:2px;}
    .leg-txt{color:rgba(220,235,255,.7);font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;}
    .continent-label{color:#fff;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;text-shadow:0 0 6px #000,0 0 12px #000,1px 1px 2px #000;pointer-events:none;white-space:nowrap;transition:opacity .3s;}
    .ocean-label{color:#7dd4fc;font-size:9px;font-weight:400;font-style:italic;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 8px rgba(0,30,80,.9),0 0 4px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap;transition:opacity .3s;}
  </style>
</head>
<body>
<div id="info"><h1>El Mundo</h1><p>Corrientes marinas · inclinación axial real 23.5°</p></div>
<div id="controls-hint">ARRASTRAR · RUEDA = ZOOM · DOBLE CLIC = RESET</div>
<div id="speed-control"><label>VELOCIDAD</label><input type="range" id="speedSlider" min="0" max="10" value="2" step="0.1"/></div>
<div id="legend">
  <div class="leg-title">Temperatura superficial</div>
  <div class="leg-bar"></div>
  <div class="leg-labels"><span>← Fría (0°C)</span><span>Cálida (30°C) →</span></div>
  <hr class="leg-sep">
  <div class="leg-row"><div class="leg-line" style="background:linear-gradient(to right,#ff1100,#ffaa00)"></div><span class="leg-txt">Corriente cálida</span></div>
  <div class="leg-row"><div class="leg-line" style="background:linear-gradient(to right,#0008aa,#00ccff)"></div><span class="leg-txt">Corriente fría</span></div>
  <div class="leg-row"><div class="leg-line" style="background:linear-gradient(to right,#ff4400,#00ddff,#ff4400)"></div><span class="leg-txt">Giro oceánico (circuito)</span></div>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.158.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.158.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls }             from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const BASE='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r158/examples/textures/planets/';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none;';
document.body.appendChild(labelRenderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(0,0,3.2);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=1.5;controls.maxDistance=10;
renderer.domElement.addEventListener('dblclick',()=>{camera.position.set(0,0,3.2);controls.target.set(0,0,0);controls.update();});

(()=>{const N=8000,p=new Float32Array(N*3),s=new Float32Array(N);
for(let i=0;i<N;i++){p[i*3]=(Math.random()-.5)*300;p[i*3+1]=(Math.random()-.5)*300;p[i*3+2]=(Math.random()-.5)*300;s[i]=Math.random()*1.5+.3;}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('size',new THREE.BufferAttribute(s,1));
scene.add(new THREE.Points(g,new THREE.ShaderMaterial({
vertexShader:`attribute float size;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(300./-mv.z);gl_Position=projectionMatrix*mv;}`,
fragmentShader:`void main(){float d=distance(gl_PointCoord,vec2(.5));if(d>.5)discard;gl_FragColor=vec4(1,1,1,1.-smoothstep(.3,.5,d));}`,
transparent:true,depthWrite:false})));})();

const earthGroup=new THREE.Group();earthGroup.rotation.z=23.5*Math.PI/180;scene.add(earthGroup);
const ldr=new THREE.TextureLoader();
const earthMesh=new THREE.Mesh(new THREE.SphereGeometry(1,64,64),new THREE.MeshPhongMaterial({
  map:ldr.load(BASE+'earth_atmos_2048.jpg'),bumpMap:ldr.load(BASE+'earth_normal_2048.jpg'),bumpScale:.05,
  specularMap:ldr.load(BASE+'earth_specular_2048.jpg'),specular:new THREE.Color(0x224488),shininess:15}));
earthGroup.add(earthMesh);
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.025,64,64),new THREE.MeshPhongMaterial({color:0x3366ff,transparent:true,opacity:.06,depthWrite:false})));
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,64,64),new THREE.ShaderMaterial({
  vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vN;void main(){float i=pow(.68-dot(vN,vec3(0,0,1)),4.);gl_FragColor=vec4(.2,.5,1,1)*i;}`,
  blending:THREE.AdditiveBlending,side:THREE.BackSide,transparent:true,depthWrite:false})));
earthGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1.5,0),new THREE.Vector3(0,1.5,0)]),new THREE.LineBasicMaterial({color:0xffffff,opacity:.15,transparent:true})));
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(5,2,3);scene.add(sun);
const fill=new THREE.DirectionalLight(0x8899cc,.6);fill.position.set(-5,-1,-3);scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,.5));

function ll(lat,lon,r=1.08){const phi=(90-lat)*Math.PI/180,theta=(lon+180)*Math.PI/180;return new THREE.Vector3(-(r*Math.sin(phi)*Math.cos(theta)),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));}

const labelObjects=[];
function addLabel(text,lat,lon,cls){const d=document.createElement('div');d.className=cls;d.textContent=text;const o=new CSS2DObject(d);o.position.copy(ll(lat,lon));earthMesh.add(o);labelObjects.push(o);}
addLabel('NORTE AMÉRICA',48,-100,'continent-label');addLabel('SUR AMÉRICA',-14,-56,'continent-label');
addLabel('EUROPA',52,18,'continent-label');addLabel('ÁFRICA',5,22,'continent-label');
addLabel('ASIA',47,95,'continent-label');addLabel('OCEANÍA',-27,134,'continent-label');
addLabel('ANTÁRTIDA',-80,0,'continent-label');
addLabel('OCÉANO PACÍFICO NORTE',28,-155,'ocean-label');addLabel('OCÉANO PACÍFICO SUR',-32,-138,'ocean-label');
addLabel('OCÉANO ATLÁNTICO NORTE',40,-35,'ocean-label');addLabel('OCÉANO ATLÁNTICO SUR',-28,-16,'ocean-label');
addLabel('OCÉANO ÍNDICO',-20,78,'ocean-label');addLabel('OCÉANO ÁRTICO',85,0,'ocean-label');
addLabel('OCÉANO AUSTRAL',-62,50,'ocean-label');

const T={
  HOT:  [1.00,0.08,0.03],
  W1:   [1.00,0.40,0.05],
  W2:   [1.00,0.68,0.10],
  W3:   [0.88,0.98,0.14],
  M1:   [0.30,0.98,0.55],
  M2:   [0.08,0.88,0.80],
  C1:   [0.05,0.52,1.00],
  C2:   [0.02,0.20,0.90],
  C3:   [0.00,0.06,0.60],
  C4:   [0.00,0.03,0.42],
};
function lerpRGB(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

const CURRENTS=[
  // GIRO PAC. NORTE
  {cA:T.W1,cB:T.HOT,n:55,s:.0013,pts:[[14,-106],[14,-128],[14,-152],[14,-175],[14,170],[14,152],[14,137],[14,127]]},
  {cA:T.HOT,cB:T.W2,n:50,s:.0018,pts:[[14,127],[23,129],[28,133],[34,138],[37,141],[40,148],[43,154],[45,158]]},
  {cA:T.W2,cB:T.M1,n:50,s:.0013,pts:[[44,158],[44,170],[44,-175],[44,-162],[44,-150],[44,-137]]},
  {cA:T.M1,cB:T.M2,n:45,s:.0012,pts:[[43,-137],[47,-135],[51,-141],[55,-150],[56,-158],[54,-165],[52,-173]]},
  {cA:T.C2,cB:T.M2,n:45,s:.0015,pts:[[57,162],[52,157],[47,152],[42,147],[37,143],[34,141]]},
  {cA:T.C1,cB:T.M2,n:50,s:.0015,pts:[[44,-137],[44,-128],[38,-124],[30,-120],[23,-114],[17,-107],[14,-106]]},

  // GIRO PAC. SUR
  {cA:T.M1,cB:T.W1,n:55,s:.0013,pts:[[-5,-82],[-5,-105],[-5,-130],[-5,-155],[-5,-175],[-5,172],[-5,155],[-12,148]]},
  // Desviación parcial Ec.Norte Pacífico → Contracorriente (corriente de retorno)
  {cA:T.HOT,cB:T.W1,n:28,s:.0012,pts:[[14,127],[11,130],[8,132]]},
  {cA:T.W1,cB:T.W1,n:55,s:.0011,pts:[[8,132],[8,150],[8,167],[8,-175],[8,-155],[8,-132],[8,-110],[8,-95]]},
  {cA:T.W1,cB:T.W3,n:45,s:.0015,pts:[[-12,148],[-16,157],[-22,156],[-28,155],[-34,152],[-40,151],[-43,149]]},
  {cA:T.M2,cB:T.C4,n:30,s:.001,pts:[[-43,149],[-52,148],[-57,148]]},
  {cA:T.C1,cB:T.M2,n:40,s:.0012,pts:[[-35,115],[-27,113],[-20,113],[-13,116],[-8,118]]},
  {cA:T.C3,cB:T.M1,n:55,s:.0015,pts:[[-58,-90],[-52,-80],[-45,-75],[-37,-73],[-28,-72],[-20,-72],[-12,-78],[-4,-81],[-5,-82]]},

  // GIRO ATL. NORTE
  {cA:T.W1,cB:T.HOT,n:50,s:.0013,pts:[[13,-20],[13,-38],[13,-56],[10,-62]]},
  {cA:T.W1,cB:T.HOT,n:60,s:.0015,pts:[[-3,-35],[1,-46],[5,-55],[8,-59],[10,-62],[11,-65],[12,-72],[13,-77],[15,-82],[18,-87],[21,-86]]},
  {cA:T.HOT,cB:T.W3,n:65,s:.0018,pts:[[21,-86],[24,-82],[25,-79],[28,-79],[32,-78],[36,-74],[40,-68],[44,-58],[48,-44],[51,-32],[55,-20],[58,-8],[61,2],[63,5]]},
  {cA:T.W3,cB:T.M2,n:35,s:.0015,pts:[[62,5],[65,8],[68,12],[70,15]]},
  {cA:T.C3,cB:T.C1,n:45,s:.0015,pts:[[75,-68],[68,-60],[60,-54],[53,-53],[47,-52],[42,-50]]},
  {cA:T.C4,cB:T.C3,n:40,s:.0014,pts:[[80,-12],[73,-20],[67,-23],[61,-28],[56,-36]]},
  {cA:T.C1,cB:T.M2,n:50,s:.0014,pts:[[55,-20],[50,-14],[43,-12],[36,-12],[28,-15],[20,-18],[13,-20]]},
  // Desviación parcial Ec.Norte Atlántico → Contracorriente (corriente de retorno)
  {cA:T.HOT,cB:T.W1,n:25,s:.0012,pts:[[10,-62],[8,-57],[5,-50]]},
  {cA:T.W1,cB:T.W1,n:45,s:.0011,pts:[[5,-50],[5,-38],[5,-24],[5,-13],[4,-4],[4,5]]},
  {cA:T.W1,cB:T.W1,n:35,s:.001,pts:[[4,-15],[3,-8],[2,-2],[1,3],[0,5]]},

  // GIRO ATL. SUR
  {cA:T.W1,cB:T.W1,n:45,s:.0012,pts:[[-3,5],[-3,-12],[-4,-25],[-5,-35]]},
  {cA:T.HOT,cB:T.W3,n:50,s:.0015,pts:[[-5,-35],[-12,-36],[-20,-38],[-28,-45],[-35,-52],[-38,-52]]},
  {cA:T.C3,cB:T.C1,n:50,s:.0014,pts:[[-55,-65],[-50,-61],[-44,-57],[-40,-54],[-38,-52]]},
  {cA:T.M1,cB:T.C1,n:70,s:.0013,pts:[[-38,-52],[-39,-42],[-40,-30],[-40,-18],[-39,-6],[-38,6],[-38,18]]},
  {cA:T.C2,cB:T.M2,n:45,s:.0013,pts:[[-38,18],[-30,14],[-22,12],[-14,10],[-6,9],[-3,5]]},

  // GIRO ÍNDICO
  {cA:T.W1,cB:T.W1,n:50,s:.0012,pts:[[-8,118],[-10,102],[-10,85],[-10,68],[-10,54],[-11,44]]},
  {cA:T.W1,cB:T.W2,n:38,s:.0012,pts:[[-12,44],[-17,42],[-22,39],[-26,37],[-28,35]]},
  {cA:T.W2,cB:T.M1,n:45,s:.0015,pts:[[-20,38],[-25,37],[-29,33],[-33,30],[-36,26],[-38,24],[-40,21]]},
  {cA:T.M1,cB:T.C4,n:30,s:.001,pts:[[-40,21],[-50,24],[-57,28]]},
  {cA:T.W1,cB:T.W1,n:40,s:.0011,pts:[[10,80],[10,70],[10,60],[10,52],[8,48]]},

  // CIRCUMPOLAR
  {closed:true,n:130,s:.0007,cA:T.C4,cB:T.C4,pts:[[-57,-175],[-55,-148],[-57,-120],[-58,-90],[-56,-60],[-57,-30],[-55,-2],[-57,28],[-55,58],[-57,88],[-55,118],[-57,148],[-55,175]]},
];

const animCurrents=[];
const R=1.027;

function buildCurrent({pts,cA,cB,n=50,s=.0015,closed=false}){
  const vecs=pts.map(([la,lo])=>ll(la,lo,R));
  const curve=new THREE.CatmullRomCurve3(vecs,closed,'catmullrom',.5);
  const NL=200,lineP=new Float32Array((NL+1)*3),lineC=new Float32Array((NL+1)*3);
  const ptsCurve=curve.getPoints(NL);
  for(let i=0;i<=NL;i++){
    const p=ptsCurve[Math.min(i,NL-1)],t=i/NL;
    lineP[i*3]=p.x;lineP[i*3+1]=p.y;lineP[i*3+2]=p.z;
    const[r,g,b]=lerpRGB(cA,cB,t);lineC[i*3]=r;lineC[i*3+1]=g;lineC[i*3+2]=b;
  }
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(lineP,3));
  lg.setAttribute('color',new THREE.BufferAttribute(lineC,3));
  earthMesh.add(closed
    ?new THREE.LineLoop(lg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.38,depthWrite:false}))
    :new THREE.Line(  lg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.38,depthWrite:false})));
  const pp=new Float32Array(n*3),pc=new Float32Array(n*3);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pp,3));
  geo.setAttribute('color',new THREE.BufferAttribute(pc,3));
  earthMesh.add(new THREE.Points(geo,new THREE.PointsMaterial({vertexColors:true,size:.013,sizeAttenuation:true,transparent:true,opacity:.95,depthWrite:false})));
  const offsets=Array.from({length:n},(_,i)=>i/n);
  animCurrents.push({curve,geo,offsets,s,n,closed,cA,cB});
}

CURRENTS.forEach(buildCurrent);

const speedSlider=document.getElementById('speedSlider');
const _wp=new THREE.Vector3();

(function animate(){
  requestAnimationFrame(animate);
  earthMesh.rotation.y+=parseFloat(speedSlider.value)*.001;
  controls.update();
  const camDir=camera.position.clone().normalize();
  labelObjects.forEach(o=>{o.getWorldPosition(_wp);o.element.style.opacity=_wp.clone().normalize().dot(camDir)>.1?'1':'0';});
  animCurrents.forEach(({curve,geo,offsets,s,n,closed,cA,cB})=>{
    const p=geo.attributes.position.array,c=geo.attributes.color.array;
    for(let i=0;i<n;i++){
      offsets[i]=(offsets[i]+s)%1;
      const t=closed?offsets[i]:Math.min(offsets[i],.9999);
      const v=curve.getPoint(t);p[i*3]=v.x;p[i*3+1]=v.y;p[i*3+2]=v.z;
      const[r,g,b]=lerpRGB(cA,cB,t);c[i*3]=r;c[i*3+1]=g;c[i*3+2]=b;
    }
    geo.attributes.position.needsUpdate=true;
    geo.attributes.color.needsUpdate=true;
  });
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
})();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
